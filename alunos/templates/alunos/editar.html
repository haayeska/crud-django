{% extends 'alunos/base.html' %}

{% block titulo %}Editar {{ aluno.nome }} · Portal de Alunos{% endblock %}

{% block conteudo %}
<section class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4 mb-3">Editar aluno</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="row g-3">
        {% include 'alunos/_campos.html' %}
      </div>
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
        <a href="{% url 'lista_alunos' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
